name: Publish JS packages

# One-click release of every @jlaviole90/* package to GitHub Packages.
# All five packages are bumped to the same version and published together.
#
# Trigger from the Actions tab: "Publish JS packages" -> Run workflow
#   bump = patch | minor | major
#
# Consumers install by adding to their .npmrc:
#   @jlaviole90:registry=https://npm.pkg.github.com
#   //npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}
# where GITHUB_TOKEN is a PAT with read:packages scope.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump applied to all packages"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-js
  cancel-in-progress: false

jobs:
  publish:
    name: Bump, build, publish, tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@jlaviole90"
          cache: "npm"

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Bump versions in lockstep
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        # Do NOT use `npm version` here. In npm 10 (Node 20) `npm version`
        # inside a workspace subdir tries to reconcile the root lockfile,
        # which forces resolution of every listed dep. Once we bump tracker
        # to 0.1.1 but tracker-next still pins tracker@0.1.0 in its
        # dependencies, the workspace no longer satisfies the pin and npm
        # reaches out to GitHub Packages for tracker@0.1.0 — which doesn't
        # exist on a first release — and fails with E404. Pure JSON editing
        # sidesteps all of that: no lockfile churn, no registry hits.
        run: |
          set -euo pipefail
          node - <<'NODE'
            const fs = require('fs');

            const bump = (process.env.BUMP || 'patch').trim();
            const trackerPkg = JSON.parse(
              fs.readFileSync('./packages/tracker/package.json', 'utf8')
            );
            const [maj, min, pat] = trackerPkg.version.split('.').map(Number);
            let next;
            if (bump === 'major')      next = `${maj + 1}.0.0`;
            else if (bump === 'minor') next = `${maj}.${min + 1}.0`;
            else                        next = `${maj}.${min}.${pat + 1}`;

            const PKGS = [
              'packages/tracker',
              'packages/tracker-next',
              'packages/tracker-angular',
              'packages/dashboard-react',
              'packages/dashboard-angular',
            ];
            for (const dir of PKGS) {
              const file = `${dir}/package.json`;
              const j = JSON.parse(fs.readFileSync(file, 'utf8'));
              j.version = next;
              if (j.dependencies && j.dependencies['@jlaviole90/tracker']) {
                j.dependencies['@jlaviole90/tracker'] = next;
              }
              fs.writeFileSync(file, JSON.stringify(j, null, 2) + '\n');
            }

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${next}\n`);
            console.log(`Bumped all packages to v${next}`);
          NODE

      - name: Build all packages
        # Workspaces resolve sibling packages via the local filesystem, so the
        # stale lockfile pin is fine for build. We refresh it after publish,
        # once the registry actually has the new versions.
        run: npm run build --workspaces --if-present

      - name: Publish @jlaviole90/tracker
        working-directory: packages/tracker
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      - name: Publish @jlaviole90/tracker-next
        working-directory: packages/tracker-next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      - name: Publish @jlaviole90/tracker-angular
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Also an ng-packagr build (partial Ivy) — must publish from the
        # dist/ payload so Angular consumers get ɵɵngDeclareInjectable
        # instead of raw runtime decorators that force JIT.
        run: |
          set -euo pipefail
          DIST=packages/tracker-angular/dist
          test -d "$DIST" || { echo "ng-packagr output missing at $DIST"; exit 1; }
          cp packages/tracker-angular/README.md "$DIST/" 2>/dev/null || true
          cd "$DIST" && npm publish

      - name: Publish @jlaviole90/dashboard-react
        working-directory: packages/dashboard-react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      - name: Publish @jlaviole90/dashboard-angular
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # ng-packagr emits a ready-to-publish directory at dist/; we publish
        # from there so the consumer-facing package.json is the one ng-packagr
        # generated (with main/module/types wired up) rather than the source.
        run: |
          set -euo pipefail
          DIST=packages/dashboard-angular/dist
          test -d "$DIST" || { echo "ng-packagr output missing at $DIST"; exit 1; }
          cp packages/dashboard-angular/README.md "$DIST/" 2>/dev/null || true
          cd "$DIST" && npm publish

      - name: Refresh lockfile now that registry has new versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Non-blocking: registry propagation can lag a few seconds, and a stale
        # lockfile in the commit is purely cosmetic — nothing downstream reads
        # it before the next local `npm install`.
        run: npm install --no-audit --no-fund --package-lock-only || true

      - name: Commit version bump + tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "release: js packages v${VERSION}"
          fi
          git tag -a "js-v${VERSION}" -m "JS packages v${VERSION}"
          git push origin HEAD:${GITHUB_REF_NAME} --follow-tags
