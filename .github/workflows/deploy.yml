name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch or SHA to deploy"
        required: false
        default: "main"

concurrency:
  # One in-flight deploy per target, cancel any queued duplicates.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy when CI succeeded (or when triggered manually).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # Gate on an environment so secrets + approvals can live in one place.
    environment: production
    timeout-minutes: 15

    steps:
      - name: Resolve ref
        id: ref
        run: |
          REF="${{ github.event.inputs.branch || 'main' }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Pull + rebuild on remote
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          REF:  ${{ steps.ref.outputs.ref }}
        run: |
          # Single SSH call so any failure aborts the whole deploy; the
          # remote script is self-contained and safe to re-run.
          ssh ubuntu@"$HOST" bash -s <<EOF
          set -euxo pipefail
          cd /opt/webalytics
          git fetch --all --prune
          git checkout $REF
          git reset --hard origin/$REF

          # Rebuild the Go binary and restart all services.
          sudo docker compose --env-file .env.prod \
            -f docker-compose.yml -f docker-compose.prod.yml \
            build --no-cache api
          sudo docker compose --env-file .env.prod \
            -f docker-compose.yml -f docker-compose.prod.yml \
            up -d

          # Wait for the api to answer /healthz before we call the deploy green.
          for i in \$(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "api healthy"
              exit 0
            fi
            sleep 5
          done
          echo "api never became healthy" >&2
          sudo docker compose --env-file .env.prod \
            -f docker-compose.yml -f docker-compose.prod.yml \
            logs api --tail 100 >&2 || true
          exit 1
          EOF

      - name: Smoke test via public URL
        env:
          PUBLIC_URL: ${{ secrets.DEPLOY_PUBLIC_URL }}
        if: env.PUBLIC_URL != ''
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 "$PUBLIC_URL/healthz" 2>/dev/null || echo "000")
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "public /healthz OK"
              exit 0
            fi
            sleep 10
          done
          echo "public /healthz never returned 200 after 12 attempts" >&2
          exit 1
