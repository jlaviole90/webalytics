# docker-compose.prod.yml
#
# Production overlay for the Lightsail deploy. Usage:
#   docker compose --env-file .env.prod \
#     -f docker-compose.yml -f docker-compose.prod.yml \
#     --profile prod up -d
#
# Scope on purpose: the AWS box hosts only the ingest + query service
# (Go api + postgres + clickhouse + redis) fronted by Caddy for TLS.
# The dashboard / any UI is NOT deployed here — it's UI-over-API and
# can run anywhere (laptop, Vercel, embedded in the tracker package
# later). Keeps this box focused on the one job that must be public.
#
# Differences from the base compose file:
#   - DB ports are not bound to the host (security)
#   - No demo-next (that's a local dogfood writer, not a prod service)
#   - No dashboard-next (see above; local `make up-demo` still runs it)
#   - Adds a Caddy reverse proxy on :80 / :443 with auto Let's Encrypt

services:
  postgres:
    # Override the base mapping by setting to empty. Docker compose merges
    # lists, so without this the :5432 publish would still apply.
    ports: []

  clickhouse:
    ports: []

  redis:
    ports: []

  api:
    ports: []
    environment:
      LOG_LEVEL: info
      LOG_FORMAT: json
      POSTGRES_APP_DSN: postgres://webalytics_app:app-password@postgres:5432/webalytics?sslmode=disable
      POSTGRES_INGEST_DSN: postgres://webalytics_ingest:ingest-password@postgres:5432/webalytics?sslmode=disable
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-webalytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-webalytics}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required in prod}
      REDIS_ADDR: redis:6379
      # MUST be set in .env: used as HMAC salt for the rotating session id.
      SESSION_SALT_BASE: ${SESSION_SALT_BASE:?SESSION_SALT_BASE is required in prod}
      INGEST_BATCH_MAX_ROWS: 200
      INGEST_BATCH_FLUSH_MS: 250ms

  caddy:
    # Only spin up in prod; local dev hits api directly on :8080.
    profiles: ["prod"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Required. Either your own hostname or <ip>.nip.io. Caddy auto-
      # HTTPSes the site and redirects :80 -> :443 for you.
      DOMAIN: ${DOMAIN:?DOMAIN is required in prod}
      # Optional Let's Encrypt account email for expiry warnings.
      ACME_EMAIL: ${ACME_EMAIL:-}
    depends_on:
      api:
        condition: service_started

  # demo-next and dashboard-next are intentionally omitted from prod.
  # They still exist in the base compose under `profiles: ["demo"]`,
  # so `make up-demo` keeps working locally.

volumes:
  caddy_data:
  caddy_config:
