# docker-compose.yml
# Local development stack for webalytics. Brings up Postgres, ClickHouse,
# Redis, and the Go service. Use `make up` to start, `make down` to stop.
#
# Services use host.docker.internal / container DNS so the Go service can
# reach them without DNS fiddling. Ports are also published on localhost so
# you can connect directly with psql / clickhouse-client / redis-cli.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-webalytics}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 2s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-webalytics}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-webalytics}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"  # HTTP
      - "9000:9000"  # native
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./migrations/clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # Use clickhouse-client (native port 9000) rather than wget on 8123 —
      # the HTTP port starts answering before the native protocol, so HTTP
      # alone causes the Go client (which uses 9000) to race and fail.
      test: ["CMD-SHELL", "clickhouse-client --user=webalytics --password=${CLICKHOUSE_PASSWORD:-changeme} -q 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    # One-shot postgres migrator. Runs after postgres is up, applies everything
    # in migrations/postgres/*.up.sql in order, then exits. The Go service
    # depends on it so it won't start with a half-migrated schema.
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-webalytics}
    volumes:
      - ./migrations/postgres:/migrations:ro
      - ./deploy/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      POSTGRES_APP_DSN: postgres://webalytics_app:app-password@postgres:5432/webalytics?sslmode=disable
      POSTGRES_INGEST_DSN: postgres://webalytics_ingest:ingest-password@postgres:5432/webalytics?sslmode=disable
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-webalytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-webalytics}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      REDIS_ADDR: redis:6379
      SESSION_SALT_BASE: ${SESSION_SALT_BASE:-please-change-me-to-32-random-bytes-xx}
      GEOIP_DB_PATH: ""
      INGEST_BATCH_MAX_ROWS: 100
      INGEST_BATCH_FLUSH_MS: 100ms
    ports:
      - "8080:8080"

  demo-next:
    # Next.js dogfood "writer" app — imports @jlaviole90/tracker-next and
    # POSTs pageviews/events at the api container. Opt-in; use `--profile
    # demo` (or `make up-demo`) so the core stack stays lean.
    profiles: ["demo"]
    build:
      context: .
      dockerfile: apps/demo-next/Dockerfile
      args:
        # The Go seed script uses the same stable id so pageviews land on a
        # real site the moment the stack starts.
        NEXT_PUBLIC_WEBALYTICS_SITE_ID: ${NEXT_PUBLIC_WEBALYTICS_SITE_ID:-wb_live_seedseedseedseed}
        NEXT_PUBLIC_WEBALYTICS_HOST: ${NEXT_PUBLIC_WEBALYTICS_HOST:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

  dashboard-next:
    # Read-only "reader" app: server components call /v1/stats/* with a
    # bearer token that stays inside the container. Seed values (site UUID,
    # token) are randomized per `make seed`, so we bind-mount ./deploy so
    # the app can read deploy/.seeded.env at request time.
    profiles: ["demo"]
    build:
      context: .
      dockerfile: apps/dashboard-next/Dockerfile
    environment:
      # Inside the docker network the api is reachable as `api:8080`.
      WEBALYTICS_API_HOST: http://api:8080
      # Token + UUID are populated via the mounted seed file; overriding
      # them here takes precedence if set.
      # WEBALYTICS_API_TOKEN: ""
      # WEBALYTICS_SITE_UUID: ""
    volumes:
      - ./deploy:/app/deploy:ro
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_started

volumes:
  pg_data:
  ch_data:
